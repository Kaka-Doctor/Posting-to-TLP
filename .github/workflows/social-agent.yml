name: Social Media Agent

# ─────────────────────────────────────────────────────────────────────────────
#  The agent runs ON GitHub — no web host needed (no Vercel / Netlify / server).
#
#  GitHub's cron fires this workflow on TWO schedules:
#    • "3 3 * * *"   — daily 06:03 EAT PUNCTUALITY fire: the first run after
#      the 06:00 slot publishes the Instagram half at ~06:04-06:07 EAT (IG's
#      own API scheduling is not available, so a landed run right after the
#      slot is as close to 06:00 as GitHub can get; owner rule 2026-09-23:
#      "if possible it would also post on ig at 10:00am"-style punctuality).
#    • "13,43 * * * *" — 30-min heartbeat around the clock (off-peak minutes
#      — GitHub drops scheduled runs at peak minutes when Actions load is
#      high). Retries for a missed IG half land on these fires within the
#      420-min catch-up window (06:00-13:00 EAT, ending 10:00 UTC,
#      "graceMinutes" in data/config.json). WHY 420 (2026-09-29 fix): this
#      page's 06:00 EAT slot is the EARLIEST of the three pages and GitHub
#      drops most 03:00-07:00 UTC fires, so the old 240-min window closed
#      30 min BEFORE the reliable 07:30-09:45 UTC landing cluster — the IG
#      half then stranded as "FB only". The window now ENDS at 10:00 UTC —
#      the same window-END time Biblia Tafsiri Mbalimbali reliably posts
#      within every day, and it CONTAINS the whole landing cluster. Past the
#      window the day's IG half is skipped — sibling pages force-rescue it
#      the same afternoon via mutual rescue condition (c), or the force
#      button posts just the IG half manually.
#  Beyond that, the timing barely matters: every run that lands PRE-SCHEDULES
#  the next "scheduleDays" days (default 3) of slots with META'S OWN
#  scheduled publishing — Meta's servers then publish each post exactly at
#  its slot time (ONE post per day at 06:00 EAT by default), no matter when
#  or whether GitHub fires again.
#
#  ⟶ To CHANGE posting times: edit "slots" (and "timezone") in data/config.json
#    only — this file never needs to change.
#
#  MUTUAL RESCUE (owner rule 2026-09-24): every landed run also checks the
#  sibling pages (data/config.json "siblings") via the GitHub API and
#  dispatches a sibling whose IG half is due but has no landed run of its own
#  — API dispatches are 100% reliable, unlike cron schedules. Needs the
#  dispatch token (data/config.json "dispatchToken" — fine-grained PAT:
#  contents:read + actions:write on the sibling repos; a DISPATCH_TOKEN repo
#  secret would override it). Dispatched runs carry input
#  rescuedBy and skip their own sibling check (one hop, no ping-pong).
# ⟶ To POST RIGHT NOW (or rescue a MISSED slot the same day): Actions tab →
#    "Social Media Agent" → "Run workflow" → tick "force".
# ⟶ To TEST without publishing: same, but tick "dryRun".
# ⟶ To PAUSE: set "autoPost": false in data/config.json — the next landed
#    run also deletes any pending Meta-scheduled posts.
#
#  Free-tier notes (private repo): only runs that START bill minutes (~2-5
#  landed runs/day ≈ 100-300 of the 2000 monthly included minutes). State
#  commits after every posting keep the repo active, so scheduled workflows
#  never get auto-disabled.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "3 3 * * *"     # daily 06:03 EAT punctuality fire for the IG half
    - cron: "13,43 * * * *" # 30-min heartbeat (off-peak minutes)
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run — pick content and log the plan, publish nothing"
        type: boolean
        default: false
      force:
        description: "Force — post the most recent unposted slot right now (rescues a missed slot the same day)"
        type: boolean
        default: false
      rescuedBy:
        description: "Internal — set automatically when a sibling page's agent dispatched this run (mutual rescue); skips this run's own sibling check"
        type: string
        default: ""

# Never let two runs race on data/state.json
concurrency:
  group: social-agent
  cancel-in-progress: false

permissions:
  contents: write # to commit data/state.json back

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Any file the user drops into data/photos/ (phone PNG, huge export,
      # too-small image) is auto-converted/cropped/scaled to Instagram rules
      # and the fix is committed back to the repo.
      - name: Normalize photos
        run: |
          mkdir -p /tmp/norm && cd /tmp/norm
          npm init -y >/dev/null 2>&1
          npm install sharp --silent --no-audit --no-fund >/dev/null 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/norm/node_modules node scripts/normalize-photos.js \
            || echo "normalize skipped (non-fatal — the agent posts files as-is)"

      - name: Run the agent
        env:
          INPUT_DRY_RUN: ${{ inputs.dryRun }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_RESCUED_BY: ${{ inputs.rescuedBy }}
          # Mutual rescue (owner rule 2026-09-24): lets this agent check the
          # sibling pages' repos and dispatch their workflows when a sibling
          # has an IG half due but no landed run of its own. Token: data/config
          # "dispatchToken" (fine-grained PAT, contents:read + actions:write
          # on the sibling repos); this secret, if set, overrides it.
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          FLAGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$INPUT_FORCE" = "true" ]; then FLAGS="$FLAGS --force"; fi
          node scripts/gh-agent.mjs $FLAGS

      - name: Persist state + normalized photos
        run: |
          git config user.name "social-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "nothing changed — no commit"
          else
            git commit -m "agent: state update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push || (git pull --rebase origin main && git push)
          fi
