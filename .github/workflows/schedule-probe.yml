name: Schedule canary

# Canary for the schedule trigger. GitHub is currently not starting
# SCHEDULED runs on this repo (push + manual triggers work perfectly;
# observed 2026-09-20: 0 schedule runs across 6+ windows, 3 workflows,
# 2 cron configs, while platform status = operational — typical of
# GitHub's registration/anti-abuse heuristics for young accounts; it
# usually resolves on its own as account activity accumulates).
#
# This workflow fires hourly. As soon as a run appears here, schedules
# are working again — the agent's own every-30-min schedule will then
# post all slots automatically. DELETE this file once schedules work.

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "canary — schedule trigger works at $(date -u '+%Y-%m-%d %H:%M UTC')"
